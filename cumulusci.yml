minimum_cumulusci_version: '4.8.1'
project:
    name: flowtoolkit_Budget
    package:
        name: 'Flow Tool Kit: Universal Budget'
        namespace: FlowToolKit
        api_version: '66.0'
    dependencies:
        - github: 'https://github.com/common-unite/Flow_Tool_Kit_Public'
    git:
        default_branch: 'main'
    source_format: sfdx


plans:
    # MetaDeploy plans for the MANAGED PACKAGE ONLY (#95). The NPC and Outbound Funds
    # bundle plans live in #65 and need an install_ofm_client flow that does not exist yet.
    #
    # Frozen steps carry options, checks and ui_options only, so ignore_failure never
    # reaches the worker: every step must succeed on its own. Gates sit on task steps,
    # because checks on a flow step are silently dropped at freeze time.
    install:
        slug: install
        title: Install Universal Budget
        tier: primary
        preflight_message: "Installs the Universal Budget managed package and the Flow Tool Kit packages it depends on. Universal Budget reads your own objects, so after installing you map your budget, category, period and value objects in Budget Configuration. Nothing in your org is changed until you do."
        post_install_message: "Universal Budget is installed. It does not know your data model yet, so the next step is to map it: create a Budget Configuration record naming your budget object and its category, period and value objects. The mapping guide is at https://github.com/common-unite/flowtoolkit_Budget_Public/blob/main/documents/configuration/mapping-your-data-model.md and the quickstart at https://github.com/common-unite/flowtoolkit_Budget_Public/blob/main/documents/getting-started/quickstart.md. Then assign the Form (Universal Budget User) permission set to everyone who edits budgets, and Form (Universal Budget Template Manager) to the admins who build templates. Release notes for every version are at https://github.com/common-unite/flowtoolkit_Budget_Public/releases."
        checks:
            - when: "not tasks.check_lws_enabled()['is_enabled']"
              action: error
              message: "Lightning Web Security must be enabled. Go to Setup > Session Settings and turn on 'Use Lightning Web Security for Lightning web components'. Without it, Lightning Locker wraps every record the budget grid reads and a large budget becomes unusably slow."
            - when: "not tasks.check_enhanced_email()['is_enabled']"
              action: error
              message: "Enhanced Email must be enabled. Go to Setup > Enhanced Email and turn it on. Flow Tool Kit requires it as a package dependency."
            - when: "tasks.check_budget_installed()['is_installed']"
              action: warn
              message: "Universal Budget is already installed in this org. Use the Upgrade plan instead to move to a newer version."
        steps:
            1:
                flow: dependencies
                ui_options:
                    description: "Installs Flow Tool Kit at the version this release was built against. A package the org already has at that version is skipped."
            2:
                task: install_managed
                ui_options:
                    description: "Installs the Universal Budget managed package: the budget grid, the Budget Sheet print component, the Budget Configuration metadata type and the supporting Apex. Skipped automatically if this exact version is already installed."
            3:
                task: update_admin_profile
                ui_options:
                    description: "Grants the System Administrator profile access to the Universal Budget Apex classes and the Budget Configuration metadata type. The package ships with permissions closed, so an admin needs this to configure a budget straight after installing. Safe to re-run."

    upgrade:
        slug: upgrade
        title: Upgrade Universal Budget
        tier: additional
        preflight_message: "Upgrades Universal Budget and the Flow Tool Kit packages it depends on. Your budgets, Budget Configuration records and permission sets are not touched."
        post_install_message: "Universal Budget is upgraded. Your budgets, Budget Configuration records and permission sets were not changed. Release notes for every version are at https://github.com/common-unite/flowtoolkit_Budget_Public/releases, and the feature guides at https://github.com/common-unite/flowtoolkit_Budget_Public/blob/main/documents/README.md cover anything new."
        checks:
            - when: "not tasks.check_budget_installed()['is_installed']"
              action: error
              message: "Universal Budget is not installed in this org yet. Run the Install plan instead."
            - when: "not tasks.check_lws_enabled()['is_enabled']"
              action: error
              message: "Lightning Web Security must be enabled. Go to Setup > Session Settings and turn on 'Use Lightning Web Security for Lightning web components'."
        steps:
            1:
                task: update_dependencies
                ui_options:
                    description: "Upgrades Flow Tool Kit to the version this release was built against, where the org is behind."
            2:
                task: install_managed
                ui_options:
                    description: "Upgrades the Universal Budget managed package. Skipped automatically if this exact version is already installed."
            3:
                task: update_admin_profile
                ui_options:
                    description: "Re-applies System Administrator access to the Universal Budget Apex classes and the Budget Configuration metadata type, picking up anything new in this version. Safe to re-run."

flows:
    # ── Install flows: everything a working org needs, no demo-org extras ──────
    # NPC/Grantmaking flavor. Requires a Grantmaking-enabled org (orgs/npc.json
    # shape for scratch orgs):  cci flow run install_npc --org npc
    install_npc:
        description: "Install the Universal Budget for NPC Grantmaking: latest managed Flow Tool Kit release, Grantmaking permission set licenses + permission sets, Flow Tool Kit: Budget source, the NPC budget config bundle (Budget Configuration record, demo fields, forms), permission sets, and demo seed data."
        group: "Flow Tool Kit: Universal Budget"
        steps:
            # Latest managed Flow Tool Kit release (+ its dependencies)
            1:
                flow: dependencies
            # Grantmaking permission set license + permission set - the budget demo
            # touches only Grantmaking objects; the broader NPC stack (OmniStudio,
            # Fundraising, Program Management, ...) is deliberately NOT assigned
            2:
                task: assign_permission_set_licenses
                options:
                    api_names: GrantmakingPsl
                ignore_failure: True
            3:
                task: assign_permission_sets
                options:
                    api_names: GrantmakingManager
                ignore_failure: True
            # Deploy this package's own source on top of the managed base
            4:
                task: deploy
                options:
                    path: force-app
                ui_options:
                    name: "Deploy Flow Tool Kit: Budget source"
            # NPC-only, NOT packaged: grantmaking demo custom fields (caps/locks),
            # the Budget Configuration CMDT record for the standard NPC budget data
            # model, the four Edit forms, and the budgetFormSectionNPC wrapper.
            # Depends on the CMDT type (step 4).
            #
            # `unmanaged` answers exactly ONE question: what does %%%NAMESPACE_OR_C%%%
            # become in budgetFormSectionNPC.html, which nests the MANAGED Universal
            # Budget component?
            #   unmanaged: True  -> <c-universal-budget>            namespaced dev org
            #                       (LWC1504 forbids naming your own namespace)
            #   unmanaged: False -> <FlowToolKit-universal-budget>  subscriber org
            # It does NOT affect %%%NAMESPACED_ORG%%%, which every other token in this
            # bundle uses - that keys off the independent `namespaced_org` flag
            # (auto-detected as namespace == org_config.namespace). Never introduce
            # %%%NAMESPACE%%% into this bundle; managed refs are written literal
            # FlowToolKit__ on purpose.
            4.1:
                task: deploy
                options:
                    path: unpackaged/config/npc
                    namespace_inject: FlowToolKit
                    unmanaged: True
                ui_options:
                    name: "Deploy NPC grantmaking config (unpackaged)"
            # Production-grade orgs deploy flows as Draft (scratch orgs auto-activate)
            4.15:
                task: activate_flow
                options:
                    developer_names:
                        - BudgetCategory_After_Save_Resequence_Positions
                        - BudgetPeriod_After_Save_Budget_Automation
                        - BudgetCategoryValue_After_Update_Sync_Line_Item_Names
                        - BudgetCategoryValue_Before_Delete_Sync
                        - BudgetCategoryValue_Before_Save_Cell_Key
                        - BudgetAllocation_After_Save_Actuals_Sync
                        - BudgetAllocation_Before_Delete_Actuals_Sync
                        - FundingDisbursement_After_Save_Actuals_Sync
                        - IndividualApplication_After_Create_Clone_Template_Budget
                ui_options:
                    name: "Activate budget automation flows"
            # Unpackaged permission sets deploy in 4.1, AFTER the step-3 assignment pass
            4.2:
                task: assign_permission_sets
                options:
                    api_names: Form_Universal_Budget_NPC_User,Form_Universal_Budget_NPC_Manager,Form_Universal_Budget_User,Form_Universal_Budget_Template_Manager
            # Demo budget seed data (idempotent, reruns safely)
            4.3:
                task: execute_anon_soap
                options:
                    path: scripts/seed_npc_budget.apex
                ui_options:
                    name: "Seed NPC demo budget data"

    # ── CLIENT (subscriber) org install ───────────────────────────────────────
    # The install_npc flow above is for DEV orgs: its step 4 source-deploys
    # force-app, which is this package's own code. A client org must INSTALL the
    # released managed package instead, and must not get the demo seed.
    #   cci flow run install_npc_client --org <client org>
    install_npc_client:
        description: "Install the Universal Budget for NPC Grantmaking into a client (subscriber) org: the latest PRODUCTION release of Flow Tool Kit: Universal Budget and its dependencies, then the NPC grantmaking config bundle, flow activation, and permission set assignment. No demo seed data, no source deploy."
        group: "Flow Tool Kit: Universal Budget"
        steps:
            # Base Flow Tool Kit dependency + the latest PRODUCTION release of this
            # package (install_managed version: latest). This is the subscriber-org
            # equivalent of install_npc steps 1 and 4 - install the 04t, never
            # source-deploy force-app into a client org.
            1:
                flow: install_prod_no_config
            # Grantmaking permission set license for the installing admin. A client
            # org normally has Grantmaking configured already, hence ignore_failure.
            2:
                task: assign_permission_set_licenses
                options:
                    api_names: GrantmakingPsl
                ignore_failure: True
            # The NPC config bundle. `unmanaged: False` is REQUIRED here and is the
            # only difference from install_npc step 4.1: it makes
            # %%%NAMESPACE_OR_C%%% in budgetFormSectionNPC.html resolve to
            # <FlowToolKit-universal-budget>, which is how the managed component is
            # addressed from loose metadata in a subscriber org. It does NOT affect
            # %%%NAMESPACED_ORG%%% - that keys off the independent `namespaced_org`
            # flag, auto-detected as False here, so local field refs deploy bare.
            3:
                task: deploy
                options:
                    path: unpackaged/config/npc
                    namespace_inject: FlowToolKit
                    unmanaged: False
                ui_options:
                    name: "Deploy NPC grantmaking config (unpackaged)"
            # Production-grade orgs deploy flows as Draft - activate them explicitly
            4:
                task: activate_flow
                options:
                    developer_names:
                        - BudgetCategory_After_Save_Resequence_Positions
                        - BudgetPeriod_After_Save_Budget_Automation
                        - BudgetCategoryValue_After_Update_Sync_Line_Item_Names
                        - BudgetCategoryValue_Before_Delete_Sync
                        - BudgetCategoryValue_Before_Save_Cell_Key
                        - BudgetAllocation_After_Save_Actuals_Sync
                        - BudgetAllocation_Before_Delete_Actuals_Sync
                        - FundingDisbursement_After_Save_Actuals_Sync
                        - IndividualApplication_After_Create_Clone_Template_Budget
                ui_options:
                    name: "Activate budget automation flows"
            # Assigns to the INSTALLING user so the admin can verify immediately.
            # Everyone else is assigned by the client's own admin - see the runbook.
            5:
                task: assign_permission_sets
                options:
                    api_names: Form_Universal_Budget_NPC_User,Form_Universal_Budget_NPC_Manager,Form_Universal_Budget_User,Form_Universal_Budget_Template_Manager


    # Outbound Funds flavor. NPSP and Outbound Funds (Core) are installed as flow
    # steps for demo realism - deliberately NOT project dependencies; the Budget
    # package must never require them. Works on the lean org shape (orgs/dev.json):
    #   cci flow run install_ofm --org ofm
    install_ofm:
        description: "Install the Universal Budget for Outbound Funds: latest managed Flow Tool Kit release, NPSP + Outbound Funds (Core) as demo-time installs (not package dependencies), Flow Tool Kit: Budget source, the OFM budget tree bundle (Budget container object, categories/periods/values, clone + automation flows, forms), permission sets, and demo seed data."
        group: "Flow Tool Kit: Universal Budget"
        steps:
            # Latest managed Flow Tool Kit release (+ its dependencies)
            1:
                flow: dependencies
            # NPSP stack - demo-time install, NOT a package dependency
            2:
                task: update_dependencies
                options:
                    dependencies:
                        - github: 'https://github.com/SalesforceFoundation/NPSP'
                ui_options:
                    name: "Install NPSP (demo-time, not a dependency)"
            # Outbound Funds (Core) - demo-time install, NOT a package dependency
            3:
                task: update_dependencies
                options:
                    dependencies:
                        - github: 'https://github.com/SalesforceFoundation/OutboundFundsModule'
                ui_options:
                    name: "Install Outbound Funds Core (demo-time, not a dependency)"
            # Deploy this package's own source on top of the managed base
            4:
                task: deploy
                options:
                    path: force-app
                ui_options:
                    name: "Deploy Flow Tool Kit: Budget source"
            # OFM-only, NOT packaged: the custom budget tree (Budget__c container +
            # Budget_Category__c/Budget_Period__c/Budget_Value__c), lookups on
            # Funding Request/Program, Budget Configuration record, clone +
            # automation flows, the four OFM Edit forms, the record page, and the
            # budgetFormSectionOFM wrapper.
            #
            # `unmanaged` answers exactly ONE question: what does %%%NAMESPACE_OR_C%%%
            # become in budgetFormSectionOFM.html, which nests the MANAGED Universal
            # Budget component?
            #   unmanaged: True  -> <c-universal-budget>            namespaced dev org
            #                       (LWC1504 forbids naming your own namespace)
            #   unmanaged: False -> <FlowToolKit-universal-budget>  subscriber org
            # It does NOT affect %%%NAMESPACED_ORG%%%, which every other token in this
            # bundle uses - that keys off the independent `namespaced_org` flag
            # (auto-detected as namespace == org_config.namespace). Never introduce
            # %%%NAMESPACE%%% into this bundle; managed refs are written literal
            # FlowToolKit__ on purpose.
            4.1:
                task: deploy
                options:
                    path: unpackaged/config/ofm
                    namespace_inject: FlowToolKit
                    unmanaged: True
                ui_options:
                    name: "Deploy Outbound Funds budget config (unpackaged)"
            # Production-grade orgs deploy flows as Draft (scratch orgs auto-activate)
            4.15:
                task: activate_flow
                options:
                    developer_names:
                        - OFM_Budget_Category_After_Save_Resequence_Positions
                        - OFM_Budget_Period_After_Save_Budget_Automation
                        - OFM_Budget_Value_After_Update_Sync_Line_Item_Names
                        - OFM_Budget_Value_Before_Delete_Sync
                        - OFM_Budget_Value_Before_Save_Cell_Key
                        - OFM_Funding_Request_After_Create_Clone_Template_Budget
                ui_options:
                    name: "Activate budget automation flows"
            4.2:
                task: assign_permission_sets
                options:
                    api_names: Form_Universal_Budget_OFM_User,Form_Universal_Budget_OFM_Manager,Form_Universal_Budget_User,Form_Universal_Budget_Template_Manager
            # Demo dataset (idempotent; re-exercises the clone flow on every run)
            4.3:
                task: execute_anon_soap
                options:
                    path: scripts/seed_ofm_budget.apex
                ui_options:
                    name: "Seed Outbound Funds demo data"

    # ── Dev-org flows: install flow + (npc) the EC portal ──────────────────────
    #   cci flow run npc_dev_org --org npc
    npc_dev_org:
        description: "Grantmaking demo org: install_npc, the Budget record page that places the grid, plus the Grantmaking Experience Cloud portal for EC testing. Requires the Grantmaking org shape (orgs/npc.json)."
        group: "Flow Tool Kit: Universal Budget"
        steps:
            1:
                flow: install_npc
            # Shared NPC platform layer, identical to what base and the Stripe Connector
            # run. Supplies the NPC licenses, metadata, sample data and the Grantmaking
            # Portal that the demo seeds below build on. See cUnite_FormBuilder#659.
            1.1:
                flow: formbuilder:npc_org_setup
            # DEMO ONLY - deliberately NOT in unpackaged/config/npc, because that path
            # is deployed to CLIENT orgs by install_npc_client and clients place the
            # component themselves (they own their page layouts; the NPC Client Org
            # Runbook covers the App Builder step). A demo org should just work, so it
            # gets a Budget record page with the grid on it, assigned as the org
            # default via an actionOverride. See #41.
            1.5:
                task: deploy
                options:
                    path: unpackaged/config/npc_demo
                    namespace_inject: FlowToolKit
                    unmanaged: True
                ui_options:
                    name: "Deploy the demo record pages and the claim demo flow"
            # Demo-only access to the newer grantmaking application objects (#67). Kept out of
            # unpackaged/config/npc because ApplicationForm needs the Public Sector features and a
            # client org without them would fail the whole client bundle deploy.
            1.6:
                task: assign_permission_sets
                options:
                    api_names: Universal_Budget_Demo_Application_Form
                ui_options:
                    name: "Assign the demo Application Form permission set"
            # AFTER the demo bundle, never inside install_npc's seed: the clone flow that gives this
            # application form its budget ships in npc_demo, so seeding earlier creates a budgetless record.
            1.7:
                task: execute_anon_soap
                options:
                    path: scripts/seed_npc_demo_application_form.apex
                ui_options:
                    name: "Seed the demo Application Form"
            # The party side of the demo: grantee organisation, its staff, a household and the people in
            # it, wired into the award and both application records. Needs the Household record type that
            # ships in npc_demo, so it runs after the deploy like the application form seed.
            1.8:
                task: execute_anon_soap
                options:
                    path: scripts/seed_npc_demo_party.apex
                ui_options:
                    name: "Seed the demo party data (accounts, household, people)"
            # Experience Cloud users for the four demo people. Customer Community Plus is role-based, so
            # the script gives the running user a role first and asks to be run again; the flow runs it
            # twice for that reason. Needs enableOotbProfExtUserOpsEnable, which orgs/npc.json now sets.
            1.9:
                task: execute_anon_soap
                options:
                    path: scripts/seed_npc_demo_portal_users.apex
                ui_options:
                    name: "Create the demo portal users (role pass)"
            1.95:
                task: execute_anon_soap
                options:
                    path: scripts/seed_npc_demo_portal_users.apex
                ui_options:
                    name: "Create the demo portal users"
            # Grant lifecycle action plan templates. A grantmaking org runs its process on these and a
            # fresh scratch org has none, so without them the demo shows a budget with no process around it.
            1.96:
                task: execute_anon_soap
                options:
                    path: scripts/seed_npc_demo_action_plans.apex
                ui_options:
                    name: "Seed the grant lifecycle action plan templates"
            # The Grantmaking Portal is created by formbuilder:npc_org_setup at step 1.1.

    #   cci flow run ofm_dev_org --org ofm
    ofm_dev_org:
        description: "Outbound Funds demo org: alias of install_ofm. Works on the lean org shape (orgs/dev.json)."
        group: "Flow Tool Kit: Universal Budget"
        steps:
            1:
                flow: install_ofm

    # Release flows: copy the release + public files to the companion repo
    release_2gp_beta:
        steps:
            90:
                task: github_copy_subtree
                options:
                    tag_name: "latest_beta"

    release_2gp_production:
        steps:
            90:
                task: github_copy_subtree
                options:
                    tag_name: "latest"

sources:
    # Shared NPC platform layer. formbuilder:npc_org_setup builds every NPC org the
    # same way: features, permission sets, NPC metadata, Grantmaking sample data,
    # Fundraising demo data and the Grantmaking Portal. See cUnite_FormBuilder#659.
    # branch: master is deliberate. CumulusCI's default resolution strategy is
    # "production", which resolves a source to the latest RELEASE TAG, not the default
    # branch. Scratch org tooling is not packaged metadata and must not wait for a
    # package release, so this tracks master. Without it, npc_org_setup resolves to
    # whatever shipped in the last base release and silently runs an older org setup.
    formbuilder:
        github: 'https://github.com/common-unite/cUnite_FormBuilder'
        branch: master

tasks:
    # seeds run over SOAP: execute_anon puts the script in a GET URL and 431s past ~16 KB (#72)
    execute_anon_soap:
        class_path: cci_flowtoolkit_tasks.anonymous_apex_soap.ExecuteAnonymousSoap

    export_form:
        class_path: cci_flowtoolkit_tasks.export_form.ExportFormMetadata

    # Preflight checks for the MetaDeploy plans (#95). Vendored into tasks/ because the
    # MetaDeploy worker runs stock CumulusCI and cannot import cci_flowtoolkit_tasks.
    # Reference copies belong in cci-flowtoolkit-tasks/repo_tasks/.
    check_lws_enabled:
        class_path: tasks.check_lws_enabled.CheckLWSEnabled

    check_enhanced_email:
        class_path: tasks.check_enhanced_email.CheckEnhancedEmailEnabled

    # by NAME, not namespace: Universal Budget shares the FlowToolKit namespace with the
    # base package, so 'FlowToolKit' in get_installed_packages() is already true once the
    # base is in and a genuine first install would look like an upgrade
    check_budget_installed:
        class_path: tasks.check_package_installed.CheckPackageInstalled
        options:
            package_name: "Flow Tool Kit: Universal Budget"

    # Mirrors public-facing files (docs, project config, the unpackaged config
    # bundles, seed scripts) to the companion public repo so clients can browse
    # documentation, deploy the demo config, see releases, and file issues
    # without access to this private source repo. force-app is NEVER included.
    github_copy_subtree:
        options:
            repo_url: "https://github.com/common-unite/flowtoolkit_Budget_Public"
            branch: "main"
            create_release: true
            release_body: true
            include: [ "cumulusci.yml","sfdx-project.json","orgs/","README.md","unpackaged/","scripts/","documents/","tasks/" ]

    robot:
        options:
            suites: robot/flowtoolkit_Budget/tests
            options:
                outputdir: robot/flowtoolkit_Budget/results

    robot_testdoc:
        options:
            path: robot/flowtoolkit_Budget/tests
            output: robot/flowtoolkit_Budget/doc/flowtoolkit_Budget_tests.html

    run_tests:
        options:
            required_org_code_coverage_percent: 75

orgs:
    scratch:
        # Lean, fast org: installs the managed Flow Tool Kit dependency + Budget source.
        # cci flow run dev_org --org dev
        dev:
            config_file: orgs/dev.json
            days: 7
            namespaced: True
        # Grantmaking-enabled org for the NPC budget demo + Experience Cloud testing.
        # cci flow run npc_dev_org --org npc
        npc:
            config_file: orgs/npc.json
            days: 30
            namespaced: True
        # Lean org for the Outbound Funds demo (NPSP + OFM install as flow steps).
        # cci flow run ofm_dev_org --org ofm
        ofm:
            config_file: orgs/dev.json
            days: 30
            namespaced: True
        # NPC demo org for feature/grantmaking-extension (parked 2026-09-16).
        # Grantmaking shape because that work needs the NPC data model and the
        # claim seed data. Kept when sprint/2026-09-16 merged and was deleted
        # (#55 shipped in 0.12.0.1), because the parked branch resumes on it.
        # The alias keeps its original date; renaming it would orphan the org.
        # cci flow run npc_dev_org --org sprint_2026-09-12
        sprint_2026-09-12:
            config_file: orgs/npc.json
            days: 30
            namespaced: True
        # Next Salesforce release (preview window only): proves the tests pass before the
        # Dev Hub upgrades, e.g. Winter '27 on 2026-10-03 (#98). Lean shape, one day.
        # cci flow run dev_org --org preview
        preview:
            config_file: orgs/preview.json
            days: 1
            namespaced: True
        # Sprint 2026-09-26: CCS fixes #98 #99 #100 #101 (NPC shape for the
        # print pages, violations and the Grantmaking record pages).
        # cci flow run npc_dev_org --org sprint_2026-09-26
        sprint_2026-09-26:
            config_file: orgs/npc.json
            days: 30
            namespaced: True
